<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Leaflet + WMS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .info-box {
      position: absolute;
      top: 10px;
      left: 50px;
      z-index: 1000;
      background: white;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font: 14px/1.4 Arial, sans-serif;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <div class="info-box">
    Leaflet WMS test
  </div>
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    // 1) Create map
    const map = L.map('map', {
      center: [42.79, 141.01], // Sapporo example
      zoom: 10
    });

    // 2) Optional base map so you can see context underneath
    const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // 3) Your WMS layer
    const wmsLayer = L.tileLayer.wms('http://localhost:8080/ows/?MAP=/io/data/qgis_project.qgz', {
      layers: 'sapporo_clipped_utm,roads_clipped_utm,rails_clipped_utm',
      format: 'image/png',
      transparent: true,
      version: '1.3.0'

    }).addTo(map);

    // 4) Layer control
    L.control.layers(
      { 'OpenStreetMap': osm },
      { 'WMS Layer': wmsLayer }
    ).addTo(map);
  </script>
</body>
</html>
